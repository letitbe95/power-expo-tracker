name: Generate Power Exhibition Feeds

on:
  schedule:
    # Run once daily at 7:00 AM UTC (3:00 PM Beijing Time)
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-fetching all feeds'
        required: false
        default: 'false'
        type: boolean

jobs:
  generate-exhibitions:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          cd power-expo-tracker/scripts
          npm install

      - name: Execute Feed Generator
        run: |
          cd power-expo-tracker/scripts
          node generate-feed.js

      - name: Commit and Push Updated Feed Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add power-expo-tracker/feed-exhibitions.json power-expo-tracker/state-feed.json
          git diff --cached --quiet || git commit -m "chore: update power exhibitions feed [skip ci]"
          git push
